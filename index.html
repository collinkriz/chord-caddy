<title>Chord Caddy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --case:#1B2621; --case-2:#14201B; --raise:#22302A; --edge:#31423A;
  --board:#43291C; --board-hi:#9A7B62;
  --nickel:#C9CDC8; --bone:#F2ECDF; --brass:#E0AC44; --dim:#B4C4BA; --faint:#98A9A0;
  --nut:#E8DFC8;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html{background:var(--case-2); color-scheme:dark}
html,body{margin:0; height:100%}
body{
  background:var(--case-2); color:var(--bone);
  font-family:Barlow,"Helvetica Neue",Arial,sans-serif;
  font-size:16px; line-height:1.45;
  display:flex; flex-direction:column;
  overscroll-behavior:none;
}
button{font:inherit; color:inherit; background:none; border:none; cursor:pointer}

/* ---------- masthead ---------- */
.top{
  flex:0 0 auto; display:flex; align-items:baseline; gap:.55rem;
  padding:calc(env(safe-area-inset-top) + .7rem) 1rem .6rem;
  border-bottom:1px solid var(--edge); background:var(--case);
}
.top h1{
  font-family:"Barlow Condensed",Barlow,sans-serif; font-weight:600;
  font-size:1.15rem; letter-spacing:.06em; margin:0; color:var(--bone);
}
.top span{font-size:.8rem; color:var(--dim)}
.navbar{flex:0 0 auto; display:flex; align-items:stretch;
  background:var(--case); border-bottom:1px solid var(--edge)}
.backbtn{
  flex:0 0 46px; display:inline-flex; align-items:center; justify-content:center;
  line-height:0; border-right:1px solid var(--edge);
}
.backbtn svg polyline{stroke:var(--brass); stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round}
.backbtn[disabled]{cursor:default}
.backbtn[disabled] svg polyline{stroke:var(--edge)}
.backbtn:focus-visible{outline:2px solid var(--brass); outline-offset:-3px}
.tabs{flex:1 1 auto; display:flex; min-width:0; background:var(--case)}
.tabs button{
  flex:1 1 0; min-height:46px; padding:0 .15rem; white-space:nowrap;
  font-family:"Barlow Condensed",Barlow,sans-serif; font-size:.98rem;
  font-weight:600; letter-spacing:.02em; color:var(--dim);
  border-bottom:2px solid transparent; margin-bottom:-1px; color:var(--dim);
}
.tabs button[aria-current="true"]{color:var(--brass); border-bottom-color:var(--brass)}
.tabs button:focus-visible{outline:2px solid var(--brass); outline-offset:-3px}

.picker{margin:0 0 1.15rem}
.keyrow{display:flex; flex-wrap:wrap; gap:.28rem; margin-bottom:.34rem}
.keybtn{
  flex:1 1 2.4rem; min-width:2.4rem; min-height:42px;
  display:inline-flex; align-items:center; justify-content:center;
  border:1px solid var(--edge); background:var(--raise); border-radius:4px;
  padding:0 .2rem; color:var(--dim);
  font-family:"Barlow Condensed",Barlow,sans-serif; font-weight:600; font-size:1.05rem;
}
.keyrow.modes .keybtn{
  flex:0 1 auto; padding:0 .78rem; font-family:Barlow,sans-serif;
  font-weight:500; font-size:.86rem;
}
.keybtn[aria-pressed="true"]{background:var(--brass); border-color:var(--brass); color:var(--case-2)}
.keybtn:focus-visible{outline:2px solid var(--brass); outline-offset:2px}
.titleinput{
  display:block; width:100%; background:var(--raise); color:var(--bone);
  border:1px solid var(--edge); border-radius:5px; padding:.45rem .6rem;
  font-family:"Barlow Condensed",Barlow,sans-serif; font-size:2rem; font-weight:600;
  margin:0 0 .3rem;
}
.titleinput:focus{outline:none; border-color:var(--brass)}
.linky{color:var(--brass); text-decoration:underline; text-underline-offset:3px; padding:0}

.sect{border-top:1px solid var(--edge); padding:.8rem 0}
.sect:last-of-type{border-bottom:1px solid var(--edge); margin-bottom:1rem}
.secthead{display:flex; align-items:center; gap:.5rem; margin-bottom:.5rem}
.kind{font-family:"Barlow Condensed",Barlow,sans-serif; font-size:1.3rem; font-weight:600;
  letter-spacing:.05em; color:var(--brass)}
button.kind{border:1px solid var(--edge); border-radius:5px; min-height:40px; padding:0 .7rem}
.secttools{margin-left:auto; display:flex; gap:.3rem}
.secttools button{min-width:40px; min-height:40px; border:1px solid var(--edge);
  border-radius:5px; color:var(--nickel); font-size:1rem}
.secttools button[disabled]{opacity:.35}
.addch,.addsec{min-height:42px; padding:0 .9rem; border:1px dashed var(--edge);
  border-radius:5px; color:var(--nickel); font-size:.9rem}
.addsec{display:block; width:100%; margin:0 0 1rem}
.tiny{min-height:36px; padding:0 .6rem; font-size:.8rem; color:var(--nickel); margin-top:.4rem}
.sriff{display:block; width:100%; margin-top:.5rem; background:var(--case-2);
  color:var(--bone); border:1px solid var(--edge); border-radius:5px;
  padding:.5rem .6rem; font:inherit; font-size:.9rem; resize:vertical}
.sriff:focus{outline:none; border-color:var(--brass)}
.sriff::placeholder{color:var(--faint)}
.riffout{margin:.55rem 0 0; padding:.5rem .6rem; background:var(--raise);
  border:1px solid var(--edge); border-radius:5px; color:var(--bone);
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:.82rem;
  white-space:pre-wrap; overflow-x:auto}
/* One look for both modes, because transcribing means reading a source and
   typing it in side by side -- they have to match. Six string lines, numbers
   sitting on them, bar lines and bar numbers. Editing adds tap targets and a
   selection highlight; it does not change the layout.
   NOTE: not .tabgrid -- that name belongs to the chord-diagram note row. */
.tabwrap{overflow-x:auto; -webkit-overflow-scrolling:touch; margin:.5rem 0 .5rem;
  border:1px solid var(--edge); border-radius:5px; background:var(--case-2);
  padding:.55rem .5rem .7rem}
.tabed{display:grid; grid-template-columns:1.5rem repeat(var(--cols),2rem);
  gap:0; width:max-content}
.tstr{display:flex; align-items:center; justify-content:flex-end; padding-right:.4rem;
  font-size:.78rem; color:var(--nickel); font-family:ui-monospace,Menlo,monospace}
.tnum{display:flex; align-items:flex-end; padding-left:.15rem; height:1.15rem;
  font-size:.7rem; color:var(--faint); font-style:italic;
  font-variant-numeric:tabular-nums}
.tpos{
  position:relative; height:2.15rem; padding:0; border:none; border-radius:0;
  background-color:transparent;
  background-image:linear-gradient(to bottom,
    transparent calc(50% - 0.5px), var(--nickel) calc(50% - 0.5px),
    var(--nickel) calc(50% + 0.5px), transparent calc(50% + 0.5px));
}
/* the same left border on all six rows reads as one vertical bar line */
.tpos.bar{box-shadow:inset 1.5px 0 0 var(--nickel)}
.tpos b{
  position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
  background:var(--case-2); padding:0 .2rem; font-weight:600; font-size:.86rem;
  font-family:ui-monospace,Menlo,monospace; color:var(--bone);
  font-variant-numeric:tabular-nums; line-height:1;
}
/* edit mode only: a faint tick at each beat so tap targets are findable */
.tabed.ed .tpos::before{
  content:''; position:absolute; left:50%; top:17%; bottom:17%; width:1px;
  transform:translateX(-50%); background:var(--edge);
}

  font-weight:600; letter-spacing:.03em; color:var(--bone)}

           placeholder="b minor, 4 shapes&hellip;">

<script>
/* ==================================================================
   1. THEORY
   ================================================================== */
const SHARP=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const FLAT =['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
const TUNING=[4,9,2,7,11,4];                 // low E -> high e, pitch classes
const STRINGS=['E','A','D','G','B','e'];
const FLATKEYS=[5,10,3,8,1,6];               // F Bb Eb Ab Db Gb spell with flats
const pc=n=>((n%12)+12)%12;
let useFlats=false;
const nn=p=>(useFlats?FLAT:SHARP)[pc(p)];

const CHORDS={
  'major':{ivs:[0,4,7],sym:'',label:'major'},
  'minor':{ivs:[0,3,7],sym:'m',label:'minor'},
  '5':{ivs:[0,7],sym:'5',label:'power chord'},
  'sus2':{ivs:[0,2,7],sym:'sus2',label:'sus2'},
  'sus4':{ivs:[0,5,7],sym:'sus4',label:'sus4'},
  'aug':{ivs:[0,4,8],sym:'aug',label:'augmented'},
  'dim':{ivs:[0,3,6],sym:'dim',label:'diminished'},
  'dim7':{ivs:[0,3,6,9],sym:'dim7',label:'diminished 7th'},
  '7':{ivs:[0,4,7,10],sym:'7',label:'dominant 7th'},
  'maj7':{ivs:[0,4,7,11],sym:'maj7',label:'major 7th'},
  'm7':{ivs:[0,3,7,10],sym:'m7',label:'minor 7th'},
  'mMaj7':{ivs:[0,3,7,11],sym:'mMaj7',label:'minor major 7th'},
  'm7b5':{ivs:[0,3,6,10],sym:'m7b5',label:'half diminished'},
  '6':{ivs:[0,4,7,9],sym:'6',label:'major 6th'},
  'm6':{ivs:[0,3,7,9],sym:'m6',label:'minor 6th'},
  '7sus4':{ivs:[0,5,7,10],sym:'7sus4',label:'7sus4'},
  'add9':{ivs:[0,4,7,14],sym:'add9',label:'add9'},
  'madd9':{ivs:[0,3,7,14],sym:'madd9',label:'minor add9'},
  '9':{ivs:[0,4,7,10,14],sym:'9',label:'dominant 9th'},
  'maj9':{ivs:[0,4,7,11,14],sym:'maj9',label:'major 9th'},
  'm9':{ivs:[0,3,7,10,14],sym:'m9',label:'minor 9th'},
  '11':{ivs:[0,7,10,14,17],sym:'11',label:'dominant 11th'},
  '13':{ivs:[0,4,10,14,21],sym:'13',label:'dominant 13th'},
  '7b9':{ivs:[0,4,7,10,13],sym:'7b9',label:'7 flat 9'},
  '7sharp9':{ivs:[0,4,7,10,15],sym:'7#9',label:'7 sharp 9'}
};

const SCALES={
  'major':{ivs:[0,2,4,5,7,9,11],label:'major'},
  'minor':{ivs:[0,2,3,5,7,8,10],label:'natural minor'},
  'dorian':{ivs:[0,2,3,5,7,9,10],label:'Dorian'},
  'phrygian':{ivs:[0,1,3,5,7,8,10],label:'Phrygian'},
  'lydian':{ivs:[0,2,4,6,7,9,11],label:'Lydian'},
  'mixolydian':{ivs:[0,2,4,5,7,9,10],label:'Mixolydian'},
  'locrian':{ivs:[0,1,3,5,6,8,10],label:'Locrian'},
  'harmonic minor':{ivs:[0,2,3,5,7,8,11],label:'harmonic minor'},
  'melodic minor':{ivs:[0,2,3,5,7,9,11],label:'melodic minor'},
  'major pentatonic':{ivs:[0,2,4,7,9],label:'major pentatonic'},
  'minor pentatonic':{ivs:[0,3,5,7,10],label:'minor pentatonic'},
  'blues':{ivs:[0,3,5,6,7,10],label:'blues'},
  'major blues':{ivs:[0,2,3,4,7,9],label:'major blues'}
};
const DEG=['1','b2','2','b3','3','4','b5','5','b6','6','b7','7'];

/* ---- voicing search ---------------------------------------------
   Physical model: a barre presses every string it crosses, so nothing
   open or muted may sit inside one. Open strings only ring low down. */
function findVoicings(rootPc, chordKey, maxFret=15){
  const spec=CHORDS[chordKey]; if(!spec) return [];
  const targets=[...new Set(spec.ivs.map(i=>pc(rootPc+i)))];
  const fifth=pc(rootPc+7);
  const optional=(spec.ivs.length>=5 && targets.includes(fifth))?[fifth]:[];
  const required=targets.filter(t=>!optional.includes(t));
  const minStrings=spec.ivs.length<=2?3:4;
  const OPEN_ZONE=5;
  const out=[], seen=new Set();

  for(let win=0; win<=maxFret-3; win++){
    const cands=TUNING.map(openPc=>{
      const list=[null];
      for(let f=Math.max(win,1); f<=win+3 && f<=maxFret; f++)
        if(targets.includes(pc(openPc+f))) list.push(f);
      if(win<=OPEN_ZONE && targets.includes(openPc)) list.push(0);
      return list;
    });
    const cur=new Array(6);
    (function walk(s){
      if(s===6){ consider(cur.slice()); return; }
      for(const f of cands[s]){ cur[s]=f; walk(s+1); }
    })(0);

    function consider(frets){
      const sounding=[]; frets.forEach((f,i)=>{ if(f!==null) sounding.push(i); });
      if(sounding.length<minStrings) return;
      const lo=sounding[0], hi=sounding[sounding.length-1];
      for(let i=lo;i<=hi;i++) if(frets[i]===null) return;      // no muted middle
      const got=new Set(sounding.map(i=>pc(TUNING[i]+frets[i])));
      for(const t of required) if(!got.has(t)) return;
      for(const g of got) if(!targets.includes(g)) return;
      if(pc(TUNING[lo]+frets[lo])!==rootPc) return;            // root in the bass

      const frettedIdx=sounding.filter(i=>frets[i]>0);
      const fretted=frettedIdx.map(i=>frets[i]);
      const openCount=sounding.filter(i=>frets[i]===0).length;
      const minF=fretted.length?Math.min(...fretted):0;
      const maxF=fretted.length?Math.max(...fretted):0;
      const span=fretted.length?maxF-minF+1:1;
      if(span>4) return;
      if(openCount && maxF>OPEN_ZONE) return;

      let barre=null;
      const atMin=sounding.filter(i=>frets[i]===minF);
      if(atMin.length>1 && minF>0){
        const bLo=atMin[0], bHi=atMin[atMin.length-1];
        for(let i=bLo;i<=bHi;i++){
          if(frets[i]===null||frets[i]===0||frets[i]<minF) return;
        }
        barre={fret:minF, from:bLo, to:bHi};
      }
      const above=sounding.filter(i=>frets[i]>minF).length;
      const fingers=(barre?1:(minF>0?atMin.length:0))+above;
      if(fingers>4) return;

      const key=frets.map(f=>f===null?'x':f).join('-');
      if(seen.has(key)) return; seen.add(key);

      // an open string trapped between fretted ones means arching over it
      let trapped=0;
      if(frettedIdx.length){
        for(let i=frettedIdx[0]+1;i<frettedIdx[frettedIdx.length-1];i++)
          if(frets[i]===0) trapped++;
      }
      let score=sounding.length*4 - span*3 - fingers*1.5;
      score += openCount*1.5;
      if(barre) score+=2;
      if(got.size===targets.length) score+=2;
      if(minF>=3) score-=trapped*3;
      out.push({frets,span,lowFret:minF,maxFret:maxF,fingers,barre,score});
    }
  }
  out.sort((a,b)=>a.lowFret-b.lowFret||b.score-a.score);
  return out;
}

/* neck positions where this chord has a decent shape */
function positionsFor(rootPc, chordKey, maxFret){
  const all=findVoicings(rootPc,chordKey,maxFret);
  const best=new Map();
  for(const v of all) if(!best.has(v.lowFret)||best.get(v.lowFret).score<v.score) best.set(v.lowFret,v);
  return [...best.keys()].sort((a,b)=>a-b);
}

/* the best shape at every position on the neck, low to high */
function allVoicings(rootPc, chordKey, maxFret){
  const best=new Map();
  for(const v of findVoicings(rootPc,chordKey,maxFret))
    if(!best.has(v.lowFret)||best.get(v.lowFret).score<v.score) best.set(v.lowFret,v);
  return [...best.values()].sort((a,b)=>a.lowFret-b.lowFret);
}

/* best shapes, spread along the neck so options are genuinely different */
function pickVoicings(rootPc, chordKey, n, startFret=0, maxFret){
  const all=findVoicings(rootPc,chordKey,maxFret).filter(v=>v.lowFret>=startFret);
  const byScore=[...all].sort((a,b)=>b.score-a.score);
  const picked=[];
  for(const gap of [2,1,0]){
    for(const v of byScore){
      if(picked.length>=n) break;
      if(picked.includes(v)) continue;
      if(picked.every(p=>Math.abs(p.lowFret-v.lowFret)>=gap)) picked.push(v);
    }
    if(picked.length>=n) break;
  }
  return picked.sort((a,b)=>a.lowFret-b.lowFret);
}

/* ---- triads: three notes, one per string, inversions welcome -------
   This deliberately drops two rules the full-chord search enforces --
   the four-string minimum and root-in-the-bass -- because the shapes
   worth having here are three notes high on the neck, often inverted. */
const TRIAD_SETS=[[3,4,5],[2,3,4],[1,2,3],[0,1,2]];
const SET_LABEL=['G B e','D G B','A D G','E A D'];
const SET_NOTE=['top three','middle','lower middle','bottom three'];
const TRIAD_OF={major:'major',minor:'minor',dim:'dim',aug:'aug',sus2:'sus2',sus4:'sus4',
  '7':'major',maj7:'major','9':'major',maj9:'major','6':'major',add9:'major','13':'major',
  '7b9':'major','7sharp9':'major','11':'major',m7:'minor',m9:'minor',m6:'minor',
  madd9:'minor',mMaj7:'minor',m7b5:'dim',dim7:'dim','7sus4':'sus4','5':'major'};
const INVERSION=['root position','1st inversion','2nd inversion'];

function findTriads(rootPc, type, maxFret=15){
  const ivs=CHORDS[type]&&CHORDS[type].ivs.length===3?CHORDS[type].ivs:null;
  if(!ivs) return [];
  const targets=ivs.map(i=>pc(rootPc+i));
  const out=[];
  TRIAD_SETS.forEach((set,si)=>{
    for(let a=0;a<=maxFret;a++) for(let b=0;b<=maxFret;b++) for(let c=0;c<=maxFret;c++){
      const f=[a,b,c];
      const notes=f.map((fr,k)=>pc(TUNING[set[k]]+fr));
      if(new Set(notes).size!==3) continue;
      if(!targets.every(t=>notes.includes(t))) continue;
      const fretted=f.filter(x=>x>0);
      if(fretted.length){
        if(Math.max(...fretted)-Math.min(...fretted)+1>4) continue;
        if(f.includes(0)&&Math.max(...fretted)>4) continue;
      }
      const frets=[null,null,null,null,null,null];
      set.forEach((st_,k)=>frets[st_]=f[k]);
      const bass=pc(TUNING[set[0]]+f[0]);
      const inversion=bass===targets[0]?0:bass===targets[1]?1:2;
      out.push({frets,set,setIdx:si,inversion,
        lowFret:fretted.length?Math.min(...fretted):0,
        maxFret:Math.max(...f),barre:null});
    }
  });
  return out.sort((x,y)=>x.setIdx-y.setIdx||x.lowFret-y.lowFret);
}

/* diatonic chords of any key or mode */
function keyChords(rootPc, scaleKey, sevenths){
  const ivs=SCALES[scaleKey].ivs;
  if(ivs.length!==7) return [];
  const res=[];
  for(let d=0;d<7;d++){
    const steps=sevenths?[0,2,4,6]:[0,2,4];
    const rel=steps.map(st=>pc(ivs[(d+st)%7]-ivs[d]));
    let type='major';
    for(const [k,v] of Object.entries(CHORDS)){
      const a=[...new Set(v.ivs.map(pc))].sort((x,y)=>x-y);
      const b=[...new Set(rel)].sort((x,y)=>x-y);
      if(a.length===b.length && a.every((x,i)=>x===b[i])){ type=k; break; }
    }
    res.push({rootPc:pc(rootPc+ivs[d]), type, degree:d});
  }
  return res;
}
const ROMAN=['I','II','III','IV','V','VI','VII'];
function romanFor(ch, keyRootPc, scaleKey){
  const d=ch.degree, t=ch.type;
  const diff=pc(pc(ch.rootPc-keyRootPc)-[0,2,4,5,7,9,11][d]);
  const acc=diff===11?'b':diff===1?'#':'';
  let r=ROMAN[d];
  const isMinor=['minor','m7','m6','m9','madd9','mMaj7'].includes(t);
  const isDim=['dim','dim7','m7b5'].includes(t);
  if(isMinor) r=r.toLowerCase();
  if(isDim) r=r.toLowerCase()+(t==='m7b5'?'\u00F8':'\u00B0');
  if(t==='aug') r+='+';
  if(t==='7'||t==='m7'||t==='m7b5'||t==='dim7') r+='7';
  if(t==='maj7') r+='maj7';
  return acc+r;
}

/* A progression slot is either a scale degree -- {d:5} follows whatever mode
   you're in -- or a fixed chromatic chord {semi, q} measured in semitones from
   the tonic. The second kind is how secondary dominants and borrowed chords
   work: they deliberately sit outside the key, so they can't be a degree. */
const MAJREF=[0,2,4,5,7,9,11];
function rnOf(semis, type){
  semis=pc(semis);
  let d=MAJREF.indexOf(semis), acc='';
  if(d<0){
    d=MAJREF.indexOf(pc(semis+1));
    if(d>=0){ acc='b'; } else { d=MAJREF.indexOf(pc(semis-1)); acc='#'; }
  }
  if(d<0) return '?';
  let r=ROMAN[d];
  const isMinor=['minor','m7','m6','m9','madd9','mMaj7'].includes(type);
  const isDim=['dim','dim7','m7b5'].includes(type);
  if(isMinor||isDim) r=r.toLowerCase();
  if(isDim) r+=(type==='m7b5'?'ø':'°');
  if(type==='aug') r+='+';
  if(['7','m7','m7b5','dim7'].includes(type)) r+='7';
  if(type==='maj7') r+='maj7';
  return acc+r;
}

/* Turn a progression into real chords in a real key. */
function resolveProg(pr, keyRoot, scaleKey, sevenths){
  const dia=keyChords(keyRoot, scaleKey, sevenths);
  if(!dia.length) return [];
  return pr.slots.map(sl=>{
    if(sl.d!==undefined){
      const ch=dia[sl.d-1];
      return {rootPc:ch.rootPc, type:ch.type, rn:romanFor(ch,keyRoot,scaleKey), outside:false};
    }
    const rootPc=pc(keyRoot+sl.semi);
    // in some modes the "borrowed" chord is already diatonic -- don't cry wolf
    const native=dia.find(x=>x.rootPc===rootPc && x.type===sl.q);
    if(native) return {rootPc, type:sl.q, rn:romanFor(native,keyRoot,scaleKey), outside:false};
    return {rootPc, type:sl.q, rn:sl.rn||rnOf(sl.semi,sl.q), outside:true, why:sl.why};
  });
}

/* ==================================================================
   1b. WHAT KEY IS THIS
   Two different jobs. A run of notes narrows the scale but barely hints
   at the tonic, because the same seven notes are seven different modes.
   A run of chords is far more decisive: chord quality pins the mode, and
   the chord you start and end on usually is the tonic.
   ================================================================== */
/* Modes are not equally likely. Most music is major or minor, and nothing
   is ever really in Locrian. Without this, any progression that happens to
   end on its IV gets read as Mixolydian. */
const MODE_PRIOR={major:10,minor:9,mixolydian:3,dorian:3,lydian:1,phrygian:1,
  'harmonic minor':1,'melodic minor':0,locrian:-10,
  'major pentatonic':4,'minor pentatonic':4,blues:3,'major blues':3};

function scaleSig(root, key){
  return SCALES[key].ivs.map(i=>pc(root+i)).sort((a,b)=>a-b).join(',');
}

function analyzeNotes(seq){
  const set=[...new Set(seq)];
  const out=[];
  for(let root=0; root<12; root++){
    for(const key of Object.keys(SCALES)){
      const scaleSet=SCALES[key].ivs.map(i=>pc(root+i));
      const missing=set.filter(p=>!scaleSet.includes(p));
      const covered=set.length-missing.length;
      // reward coverage, punish notes the scale can't explain, and mildly
      // punish scales carrying tones the riff never used
      let score = covered*12 - missing.length*30 - (scaleSet.length-covered)*2.5;
      score += MODE_PRIOR[key]||0;
      // In a melody the opening note is the stronger clue: licks very often
      // END on the b7 or the 4th, but they rarely START anywhere but home.
      if(seq[0]===root) score+=9;                       // started there
      if(seq[seq.length-1]===root) score+=5;            // landed there
      score += seq.filter(p=>p===root).length*2.5;      // kept coming back
      if(Math.min(...seq.map(p=>pc(p-root)))===0) score+=2;  // lowest note is home
      out.push({root,key,score,missing,covered,
                size:SCALES[key].ivs.length, sig:scaleSig(root,key)});
    }
  }
  return out.sort((a,b)=>b.score-a.score);
}

function explainChord(ch, keyRoot, scaleKey, dia, dia7, par){
  const semis=pc(ch.root-keyRoot);
  const hit = dia.find(d=>d.rootPc===ch.root && d.type===ch.type)
           || dia7.find(d=>d.rootPc===ch.root && d.type===ch.type);
  if(hit) return {score:12, rn:romanFor(hit,keyRoot,scaleKey), fit:'in'};

  if(ch.type==='7' || ch.type==='major'){               // secondary dominant?
    for(let d=1; d<dia.length; d++){
      if(dia[d].type==='dim' || dia[d].type==='m7b5') continue;
      if(pc(dia[d].rootPc+7)===ch.root)
        return {score:7, fit:'sec',
                rn:'V/'+romanFor(dia[d],keyRoot,scaleKey).replace(/7$/,'')};
    }
  }
  if(par.find(d=>d.rootPc===ch.root && d.type===ch.type))
    return {score:3, rn:rnOf(semis,ch.type), fit:'bor'};   // borrowed
  if(dia.find(d=>d.rootPc===ch.root))
    return {score:2, rn:rnOf(semis,ch.type), fit:'alt'};   // right root, other flavour
  return {score:-6, rn:rnOf(semis,ch.type), fit:'out'};
}

function analyzeChords(input){
  const out=[];
  for(let root=0; root<12; root++){
    for(const [key] of KEY_MODES){
      const dia=keyChords(root,key,false);
      if(!dia.length) continue;
      const dia7=keyChords(root,key,true);
      const par=keyChords(root,'major',false).concat(keyChords(root,'minor',false));
      let score=0; const roles=[];
      for(const ch of input){
        const e=explainChord(ch,root,key,dia,dia7,par);
        score+=e.score; roles.push(e);
      }
      // Starting on the tonic is commoner than ending on it -- plenty of
      // verses end on the V and loop back round.
      const first=input[0], last=input[input.length-1];
      score += MODE_PRIOR[key]||0;
      if(first && first.root===root) score+=8;
      if(last && last.root===root) score+=5;
      if(last && last.root===root && last.type===dia[0].type) score+=3;
      score += input.filter(c=>c.root===root).length*3;   // how often it comes round
      // a V going straight to the I is the strongest tonic evidence there is --
      // but only a major or dominant V. A minor v has no pull.
      const DOM=['major','7','9','13','7b9','7sharp9','7sus4'];
      for(let i=0;i<input.length-1;i++){
        if(pc(input[i].root-root)===7 && input[i+1].root===root
           && DOM.includes(input[i].type)) score+=8;
      }
      out.push({root,key,score,roles,sig:scaleSig(root,key),
                inKey:roles.filter(r=>r.fit==='in').length});
    }
  }
  return out.sort((a,b)=>b.score-a.score);
}

// One row per distinct set of notes -- C major and A minor are the same
// seven notes, so they belong together rather than as two separate answers
function topDistinct(res, n){
  const seen=new Set(), out=[];
  for(const r of res){
    if(seen.has(r.sig)) continue;
    seen.add(r.sig); out.push(r);
    if(out.length>=n) break;
  }
  return out;
}
function relativesOf(res, r, limit=4){
  return res.filter(x=>x.sig===r.sig && !(x.root===r.root && x.key===r.key)
                       && SCALES[x.key].ivs.length===7).slice(0,limit);
}

/* ==================================================================
   2. DRAWING  (all tab and dots, no notation anywhere)
   ================================================================== */
// Fret number over the note it produces, one column per string
function tabBlock(v, rootPc, spell){
  let top='', bot='';
  v.frets.forEach((f,i)=>{
    if(f===null){
      top+='<span class="f mute">\u00D7</span>';
      bot+='<span class="n"></span>';
      return;
    }
    const p=pc(TUNING[i]+f);
    const isRoot=p===rootPc;
    top+=`<span class="f">${f}</span>`;
    bot+=`<span class="n${isRoot?' root':''}">${spell?spellAs(spell,p):nn(p)}</span>`;
  });
  return `<div class="tabgrid">${top}${bot}</div>`;
}

function chordSVG(v, rootPc){
  const W=132, H=150, L=18, R=18, T=26, B=22;
  const gw=W-L-R, gh=H-T-B, ns=5, nf=5;
  const sx=gw/(ns), fy=gh/nf;
  const openPos = v.maxFret<=4;
  const base = openPos?1:v.lowFret;
  let s=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img">`;

  // nut or position marker
  if(openPos) s+=`<rect x="${L-1}" y="${T-4}" width="${gw+2}" height="4" fill="var(--nut)"/>`;
  else s+=`<text x="${L-6}" y="${T+fy*0.72}" font-size="10.5" fill="var(--nickel)" text-anchor="end">${base}</text>`;

  // frets
  for(let f=0;f<=nf;f++){
    if(f===0&&openPos) continue;
    s+=`<line x1="${L}" y1="${T+f*fy}" x2="${L+gw}" y2="${T+f*fy}" stroke="var(--edge)" stroke-width="1"/>`;
  }
  // strings
  for(let i=0;i<=ns;i++)
    s+=`<line x1="${L+i*sx}" y1="${T}" x2="${L+i*sx}" y2="${T+gh}" stroke="var(--nickel)" stroke-width="${1.4-i*0.12}" opacity=".65"/>`;

  // Only draw a barre bar when notes sit above it. If every fretted note is
  // on one fret, chord books show separate dots, so we do too.
  const worksAsBarre = v.barre && v.frets.some(f=>f!==null && f>v.barre.fret);
  if(worksAsBarre && v.barre.fret>=base && v.barre.fret<base+nf){
    const y=T+(v.barre.fret-base+0.5)*fy;
    s+=`<rect x="${L+v.barre.from*sx-5}" y="${y-5}" width="${(v.barre.to-v.barre.from)*sx+10}" height="10" rx="5" fill="var(--bone)"/>`;
  }
  // dots and x/o
  v.frets.forEach((f,i)=>{
    const x=L+i*sx;
    if(f===null){ s+=`<text x="${x}" y="${T-7}" font-size="11" fill="var(--nickel)" text-anchor="middle">\u00D7</text>`; return; }
    if(f===0){
      const rootOpen=pc(TUNING[i])===rootPc;
      s+=`<circle cx="${x}" cy="${T-11}" r="3.4" fill="none" stroke="${rootOpen?'var(--brass)':'var(--bone)'}" stroke-width="${rootOpen?2:1.3}"/>`;
      return;
    }
    if(f<base||f>=base+nf) return;
    const y=T+(f-base+0.5)*fy;
    const isRoot=pc(TUNING[i]+f)===rootPc;
    const inBarre=worksAsBarre && f===v.barre.fret && i>=v.barre.from && i<=v.barre.to;
    if(inBarre && !isRoot) return;
    s+=`<circle cx="${x}" cy="${y}" r="5.4" fill="${isRoot?'var(--brass)':'var(--bone)'}"${
        isRoot?' stroke="var(--case-2)" stroke-width="1.5"':''}/>`;
  });
  return s+'</svg>';
}

function fretboardSVG(rootPc, ivs, showDegrees, maxFret, spell){
  const FR=maxFret||15, L=38, T=16, W=L+FR*38+16, rowH=26, H=T+5*rowH+30;
  const fw=(W-L-16)/FR;
  const set=ivs.map(i=>pc(rootPc+i));
  let s=`<svg viewBox="0 0 ${W} ${H}" width="${W}" xmlns="http://www.w3.org/2000/svg" role="img">`;
  s+=`<rect x="${L}" y="${T-8}" width="${W-L-16}" height="${5*rowH+16}" fill="var(--board)" rx="3"/>`;
  // inlays
  [3,5,7,9,15,21].filter(f=>f<=FR).forEach(f=>{
    s+=`<circle cx="${L+(f-0.5)*fw}" cy="${T+2.5*rowH}" r="4" fill="var(--board-hi)"/>`;
  });
  [12,24].filter(f=>f<=FR).forEach(f=>{
    s+=`<circle cx="${L+(f-0.5)*fw}" cy="${T+1.5*rowH}" r="4" fill="var(--board-hi)"/>`;
    s+=`<circle cx="${L+(f-0.5)*fw}" cy="${T+3.5*rowH}" r="4" fill="var(--board-hi)"/>`;
  });
  // frets + numbers
  for(let f=0;f<=FR;f++){
    const x=L+f*fw;
    s+=`<line x1="${x}" y1="${T-8}" x2="${x}" y2="${T+5*rowH+8}" stroke="${f===0?'var(--nut)':'var(--nickel)'}" stroke-width="${f===0?3:1.2}" opacity="${f===0?1:.5}"/>`;
    if(f>0) s+=`<text x="${x-fw/2}" y="${H-8}" font-size="10.5" fill="var(--nickel)" text-anchor="middle">${f}</text>`;
  }
  // strings, high e on top
  for(let i=5;i>=0;i--){
    const row=5-i, y=T+row*rowH;
    s+=`<line x1="${L}" y1="${y}" x2="${W-16}" y2="${y}" stroke="var(--nickel)" stroke-width="${0.7+row*0.18}" opacity=".55"/>`;
    s+=`<text x="10" y="${y+4}" font-size="10.5" fill="var(--nickel)" text-anchor="middle">${STRINGS[i]}</text>`;
    for(let f=0;f<=FR;f++){
      const p=pc(TUNING[i]+f);
      if(!set.includes(p)) continue;
      const x=f===0?L-13:L+(f-0.5)*fw;
      const isRoot=p===rootPc;

  const re=/\b([a-g])(?![a-z])\s*(sharp|#|flat|\bb\b)?/g;

  while((m=re.exec(cleaned))!==null){

    // "b" only counts as flat if it isn't itself the next note letter
    if(acc==='b'||acc==='flat'){ p=pc(p-1); acc='flat'; }

  if(/\b(lower|further down|down the neck|back down|move down|octave down)\b/.test(t)) out.move=-1;
  if(/\b(open position|at the nut|to the nut|first position|start over)\b/.test(t)) out.reset=true;
  if(/\b(more|other|another|different|extra)\b.*\b(option|shape|voicing|version|way)s?\b/.test(t)
     || /\b(more|show me more)\b\s*$/.test(t.trim())) out.more=true;

  // --- how far up the neck to look ---
  const fm=t.match(/\b(?:up to|to|through|past|beyond|max\w*)\s*(?:the\s*)?(?:fret\s*)?(\d{1,2})(?:st|nd|rd|th)?\s*(?:fret)?\b/)

  else if(/\b(acoustic|body join|cutaway)\b/.test(t)) out.maxFret=14;

    out.count=Math.min(8,Math.max(1, words[num[1]]||parseInt(num[1],10)));

  if(/\b(progression|changes|turnaround|sequence)s?\b/.test(t)) out.view='prog';
  else if(/\b(scale|mode)s?\b/.test(t)) out.view='scale';
  else if(/\b(key of|in the key|what chords|chords in|diatonic|family)\b/.test(t)) out.view='key';
  else if(MODEWORD.test(t)) out.view='scale';
  else if(/\b(triad|three\s*note|3\s*note|inversion)s?\b/.test(t)) out.view='triad';
  else if(/\b(full chord|whole chord|chord|shape|voicing|grip)s?\b/.test(t)) out.view='chord';

  else if(/\b(bottom|low|bass)\s*(three|3)?\s*strings?\b/.test(t)) out.set=3;
  else if(/\ball\b.*\bstrings?\b|\bevery\b/.test(t)) out.set=null;

  // --- root note ---
  // "make it a 7th" is an instruction about the current chord, so the
  // stray "a" is an article and must not be heard as the note A
  const modifying=/\b(make it|change it|turn it|switch it|now make)\b/.test(t);
  const r=modifying?null:findRoot(t);
  if(r){ out.root=r.pc; out.spell=r.spell; }

  // --- quality or scale type ---
  const table=(out.view==='scale'||out.view==='key'||out.view==='prog')?SCALEWORDS:QUALITY;
  for(const [re,val] of table){
    if(re.test(t)){
      if(table===SCALEWORDS) out.scale=val; else out.chord=val;

    }

  // bare note with nothing else, e.g. "d" or "f sharp"
  if(out.root!==undefined && !out.view && !out.chord && !out.scale)

  // "now in D" carries the current quality across instead

   with no signal. The GitHub copy is the safety net. A Netlify function
   holds the token; nothing secret is in this file. */
const SYNC_URL='/.netlify/functions/songs';

function mergeSongs(local, remote, delLocal, delRemote){
  const del={...(delRemote||{}), ...(delLocal||{})};
  for(const k of Object.keys(del))
    del[k]=Math.max((delLocal||{})[k]||0, (delRemote||{})[k]||0);
  const by={};
  for(const g of (remote||[])) by[g.id]=g;
  for(const g of (local||[])){
    const cur=by[g.id];
    if(!cur || (g.updated||0) >= (cur.updated||0)) by[g.id]=g;
  }
  const out=[];
  for(const id of Object.keys(by)){
    const g=by[id];
    if(del[id] && del[id] > (g.updated||0)) continue;   // deleted after its last edit
    out.push(g);
  }
  out.sort((a,b)=>(b.updated||0)-(a.updated||0));
  return {songs:out, deleted:del};
}

async function syncNow(quiet){
  if(sync.busy) return;
  sync.busy=true; sync.state='syncing'; if(!quiet) render();
  try{
    const r=await fetch(SYNC_URL,{headers:{'Accept':'application/json'}});
    if(r.status===501){ sync.state='off';
      sync.msg='Sync is not set up on this site yet.'; return; }
    if(!r.ok) throw new Error('read failed ('+r.status+')');
    const remote=await r.json();
    const m=mergeSongs(S.songs.list, remote.songs, S.songs.deleted, remote.deleted);
    const changed=JSON.stringify(m.songs)!==JSON.stringify(remote.songs)
               || JSON.stringify(m.deleted)!==JSON.stringify(remote.deleted||{});
    S.songs.list=m.songs; S.songs.deleted=m.deleted; saveSongs();
    sync.sha=remote.sha;
    if(changed){
      const w=await fetch(SYNC_URL,{method:'PUT',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({songs:m.songs, deleted:m.deleted, sha:remote.sha})});
      if(w.status===409){ sync.state='error'; sync.msg='Someone else saved first. Tap sync again.'; return; }
      if(!w.ok) throw new Error('write failed ('+w.status+')');
      const j=await w.json(); sync.sha=j.sha||sync.sha;
    }
    sync.state='ok'; sync.msg=''; sync.last=Date.now();
  }catch(e){
    sync.state='error';
    sync.msg=navigator.onLine===false ? 'Offline — your songs are safe here and will sync later.'
                                      : 'Could not reach GitHub. Saved locally.';
  }finally{
    sync.busy=false; render();
  }

// but Bb7 not A#7. Key signatures are a different question, so the Keys
// page keeps its own canonical spelling above.
const CHORD_KEYS=[['C',0,0],['C\u266F',1,0],['D',2,0],['E\u266D',3,1],['E',4,0],['F',5,1],
                  ['F\u266F',6,0],['G',7,0],['A\u266D',8,1],['A',9,0],['B\u266D',10,1],['B',11,0]];

function rootRow(c, list){
  let h='<div class="keyrow">';
  for(const [label,p,flat] of list)
    h+=`<button class="keybtn" data-key="${p}" data-flat="${flat}" aria-pressed="${c.root===p}">${label}</button>`;
  return h+'</div>';
}
function keyPicker(c, modes){
  let h='<div class="picker">'+rootRow(c, KEYNAMES)+'<div class="keyrow modes">';
  for(const [val,label] of modes)
    h+=`<button class="keybtn" data-mode="${val}" aria-pressed="${c.scale===val}">${label}</button>`;
  return h+'</div></div>';
}

function seg(options, active, cmdAttr){
  return '<div class="seg">'+options.map(([val,label,cmd])=>
    `<button data-cmd="${cmd}" aria-pressed="${val===active}">${label}</button>`).join('')+'</div>';
}

function render(){
  const c=cur();
  setSpelling(c);
  stage.scrollTop=0;
  if(S.section==='chords') { overlayHTML=''; { overlayHTML=''; { overlayHTML=''; { overlayHTML=''; (c.mode==='triad'?renderTriad:renderChord)(); } } } }
  else if(S.section==='scales'){ overlayHTML=''; renderScale(); }
  else if(S.section==='find'){ overlayHTML=''; renderFind(); }
  else if(S.section==='songs') renderSongs();
  else { overlayHTML=''; (S.keys.tab==='prog'?renderProg:renderKey)(); }
  // Append the footer BEFORE anything is bound: assigning innerHTML replaces
  // every child node, which would silently drop the listeners below.
  stage.innerHTML += buildFooter();
  overlay.innerHTML = overlayHTML; overlayHTML='';
  if(S.section==='songs') bindSongInputs();
  if(S.songs.tabFull){
    const on=overlay.querySelector('.tfboard .tpos.on');
    if(on && on.scrollIntoView) try{
      on.scrollIntoView({block:'nearest', inline:'center'});
    }catch(e){}
  }
  qa('[data-cmd]').forEach(b=>b.addEventListener('click',()=>run(b.dataset.cmd)));
  qa('[data-key]').forEach(b=>b.addEventListener('click',()=>commit(()=>{
    const c=cur(); c.root=+b.dataset.key; c.flat=b.dataset.flat==='1'; })));
  qa('[data-mode]').forEach(b=>b.addEventListener('click',()=>commit(()=>{
    cur().scale=b.dataset.mode; })));
  qa('[data-fadd]').forEach(b=>b.addEventListener('click',()=>commit(()=>{
    const f=S.find, root=+b.dataset.fadd, flat=b.dataset.fflat==='1';
    if(f.mode==='chords') f.chords.push({root,type:'major',flat});
    else f.notes.push({pc:root,flat});
  })));
  qa('[data-fcyc]').forEach(b=>b.addEventListener('click',()=>commit(()=>{
    const f=S.find, i=+b.dataset.fcyc;
    if(f.mode!=='chords') { f.notes.splice(i,1); return; }
    const c=f.chords[i];
    c.type=QCYCLE[(QCYCLE.indexOf(c.type)+1)%QCYCLE.length];
  })));
  qa('[data-fdel]').forEach(b=>b.addEventListener('click',()=>commit(()=>{
    const f=S.find, i=+b.dataset.fdel;
    (f.mode==='chords'?f.chords:f.notes).splice(i,1);
  })));
  const sg=S.songs;
  const bind=(sel,fn)=>qa(sel).forEach(b=>b.addEventListener('click',()=>commit(()=>fn(b))));
  bind('[data-sopen2]', b=>{ sg.openId=b.dataset.sopen2; sg.editing=false; sg.addTo=null; });
  bind('[data-sdelsong]', b=>{ const id=b.dataset.sdelsong;
    sg.deleted[id]=Date.now(); sg.list=sg.list.filter(x=>x.id!==id); saveSongs(); });
  bind('[data-saddsec]', ()=>{ const g=openSong(); touchSong(g);
    if(g){ g.sections.push(newSection('Verse')); saveSongs(); } });
  bind('[data-skind]', b=>{ const g=openSong(); touchSong(g); const sec=g&&g.sections.find(x=>x.id===b.dataset.skind);
    if(sec){ sec.kind=SECTION_KINDS[(SECTION_KINDS.indexOf(sec.kind)+1)%SECTION_KINDS.length]; saveSongs(); } });
  bind('[data-smove]', b=>{ const g=openSong(); touchSong(g); if(!g) return;
    const i=g.sections.findIndex(x=>x.id===b.dataset.smove), j=i+(+b.dataset.dir);
    if(i<0||j<0||j>=g.sections.length) return;
    const [x]=g.sections.splice(i,1); g.sections.splice(j,0,x); saveSongs(); });
  bind('[data-sdel]', b=>{ const g=openSong(); touchSong(g); if(!g) return;
    g.sections=g.sections.filter(x=>x.id!==b.dataset.sdel); saveSongs(); });
  bind('[data-sopen]', b=>{ sg.addTo = sg.addTo===b.dataset.sopen ? null : b.dataset.sopen; });
  bind('[data-sadd]', b=>{ const g=openSong(); touchSong(g); const sec=g&&g.sections.find(x=>x.id===b.dataset.sadd);
    if(sec){ sec.chords.push({root:+b.dataset.pc, type:'major', flat:b.dataset.fflat==='1'}); saveSongs(); } });
  bind('[data-scyc]', b=>{ const g=openSong(); touchSong(g); const sec=g&&g.sections.find(x=>x.id===b.dataset.scyc);
    if(sec){ const c=sec.chords[+b.dataset.i];
      c.type=QCYCLE[(QCYCLE.indexOf(c.type)+1)%QCYCLE.length]; saveSongs(); } });
  bind('[data-scaletoggle]', ()=>{ S.songs.scaleOpen=!S.songs.scaleOpen; });
  qa('[data-scalesel]').forEach(el=>el.addEventListener('change',()=>commit(()=>{
    S.songs.scalePick=+el.value; S.songs.scaleOpen=true; })));
  bind('[data-tabnew]', b=>{ const g=openSong(); touchSong(g);
    const sec=g&&g.sections.find(x=>x.id===b.dataset.tabnew);
    if(sec){ sec.tab=newTab(16); saveSongs(); } });
  bind('[data-tabdel]', b=>{ const g=openSong(); touchSong(g);
    const sec=g&&g.sections.find(x=>x.id===b.dataset.tabdel);
    if(sec){ sec.tab=null; S.songs.tsel=null; saveSongs(); } });
  bind('[data-tabcols]', b=>{ const g=openSong(); touchSong(g);
    const sec=g&&g.sections.find(x=>x.id===b.dataset.tabcols);
    if(sec&&sec.tab){ sec.tab.cols+=8;
      sec.tab.cells.forEach(row=>{ while(row.length<sec.tab.cols) row.push(''); });
      saveSongs(); } });
  bind('[data-tcell]', b=>{
    const key=b.dataset.tcell;
    S.songs.tsel = S.songs.tsel===key ? null : key;
    // entering a number needs the pad on screen, so take over the viewport
    if(S.songs.tsel && S.songs.editing) S.songs.tabFull = key.split(':')[0];
  });
  bind('[data-tabfull]', b=>{ S.songs.tabFull=b.dataset.tabfull;
    const sec=(openSong()||{sections:[]}).sections.find(x=>x.id===b.dataset.tabfull);
    if(sec && !S.songs.tsel) S.songs.tsel=sec.id+':0:0'; });
  bind('[data-tabclose]', ()=>{ S.songs.tabFull=null; S.songs.tsel=null; });
  bind('[data-tset]', b=>{
    const sel=S.songs.tsel; if(!sel) return;
    const v=b.dataset.tset;
    if(v==='done'){ S.songs.tsel=null; return; }
    const [sid,r,c]=sel.split(':');
    const g=openSong(); touchSong(g);
    const sec=g&&g.sections.find(x=>x.id===sid);
    if(sec&&sec.tab){
      sec.tab.cells[+r][+c]=v;
      const next=+c+1;                      // step along so you can keep tapping
      S.songs.tsel = next<sec.tab.cols ? sid+':'+r+':'+next : null;
      saveSongs();
    }
  });
  bind('[data-sdelch]', b=>{ const g=openSong(); touchSong(g); const sec=g&&g.sections.find(x=>x.id===b.dataset.sdelch);
    if(sec){ sec.chords.splice(+b.dataset.i,1); saveSongs(); } });
  qa('[data-sync]').forEach(b=>b.addEventListener('click',()=>syncNow()));
  qa('[data-sexport]').forEach(b=>b.addEventListener('click',exportSongs));
  qa('[data-simport]').forEach(b=>b.addEventListener('click',()=>{
    const f=document.getElementById('songfile'); if(f) f.click(); }));

  qa('[data-goroot]').forEach(b=>b.addEventListener('click',()=>commit(()=>{
    S.keys.root=+b.dataset.goroot; S.keys.scale=b.dataset.goscale;
    S.keys.flat=null; S.keys.tab='chords'; S.section='keys';
  })));
  buildTabs();
  if(S.section==='songs') bindPills();
  renderChips();
  backBtn.disabled = hist.length===0;
}

const CHORD_SEG=[['full','Full chords','full chords'],['triad','Triads','triads']];
const SCALE_SEG=[[false,'Note names','note names'],[true,'Degrees','show degrees']];
const KEY_SEG=[['chords','Chords in key','chords in the key'],['prog','Progressions','progressions']];

function renderChord(){
  const c=S.chords, spec=CHORDS[c.chord];
  const vs=allVoicings(c.root, c.chord, c.maxFret);
  const spell=chordSpelling(c.root, c.chord);
  const notes=spec.ivs.map(i=>spellAs(spell, c.root+i)).join('  ');
  const kick=`${vs.length} shapes \u00B7 nut to fret ${c.maxFret}`;

  let h=`<p class="kicker">${kick}</p><h1 class="title">${nn(c.root)}<em>${spec.sym}</em></h1>
         <p class="sub">${spec.label} &nbsp;\u00B7&nbsp; <b>${notes}</b></p>
         ${seg(CHORD_SEG,'full')}
         <div class="picker">${rootRow(c, CHORD_KEYS)}</div>`;
  if(!vs.length){
    h+=`<div class="empty">Nothing playable that far up. Try <code>lower</code>,
        or raise the ceiling with <code>up to fret 19</code>.</div>`;
  }else{
    h+='<div class="grid">';
    for(const v of vs){
      h+=`<div class="card">${chordSVG(v,c.root)}
            ${tabBlock(v,c.root,spell)}
            <div class="pos">${v.maxFret<=4?'open position':'fret '+v.lowFret}</div></div>`;
    }
    h+='</div>';
  }
  h+=`<p class="note">Every playable position, low to high — just scroll.
      Gold dots are the root. Say <code>up to fret 19</code> or <code>whole neck</code>
      to reach further, or name any other chord.</p>`;
  stage.innerHTML=h;
}

function renderTriad(){
  const c=S.chords, type=TRIAD_OF[c.chord]||'major', spec=CHORDS[type];
  const all=findTriads(c.root, type, c.maxFret);
  const spell=chordSpelling(c.root, type);
  const notes=spec.ivs.map(i=>spellAs(spell, c.root+i)).join('  ');
  const kick=`${all.length} shapes \u00B7 three notes, no doubling`;
  let h=`<p class="kicker">${kick}</p><h1 class="title">${nn(c.root)}<em>${spec.sym}</em> triads</h1>
         <p class="sub">${spec.label} &nbsp;\u00B7&nbsp; <b>${notes}</b></p>
         ${seg(CHORD_SEG,'triad')}
         <div class="picker">${rootRow(c, CHORD_KEYS)}</div>`;
  const shown=c.set===null?[0,1,2,3]:[c.set];
  let any=false;
  for(const si of shown){
    const group=all.filter(v=>v.setIdx===si);
    if(!group.length) continue;
    any=true;
    h+=`<h3 class="setname">${SET_LABEL[si]} <span>${SET_NOTE[si]} strings</span></h3><div class="grid">`;
    for(const v of group){
      h+=`<div class="card">${chordSVG(v,c.root)}
            ${tabBlock(v,c.root,spell)}
            <div class="pos">${INVERSION[v.inversion]}</div></div>`;
    }
    h+='</div>';
  }
  if(!any) h+=`<div class="empty">Nothing left up there. Say <code>lower</code> to come back down.</div>`;
  h+=`<p class="note">Three notes with nothing doubled, so they stay clear of the bass.
      Tap a string set above to see just that one.</p>`;
  stage.innerHTML=h;
}

function renderScale(){
  const c=S.scales, sc=SCALES[c.scale];
  const notes=sc.ivs.map(i=>nn(c.root+i)).join('  ');
  stage.innerHTML=`
    <p class="kicker">whole neck \u00B7 to fret ${c.maxFret}</p>
    <h1 class="title">${nn(c.root)} <em>${sc.label}</em></h1>
    <p class="sub">${sc.ivs.length} notes &nbsp;\u00B7&nbsp; <b>${notes}</b></p>
    ${seg(SCALE_SEG, c.degrees)}
    ${keyPicker(c, SCALE_MODES)}
    <div class="mapwrap">${fretboardSVG(c.root, sc.ivs, c.degrees, c.maxFret, scaleSpellMap(c.root,c.scale))}</div>
    ${vibeHTML(VIBE[c.scale])}
    <p class="note">Scroll sideways for the rest of the neck. Gold is the root.
       Degrees show each note's number in the scale, which is what makes the shape
       portable to any key.</p>`;
}

function renderKey(){
  const c=S.keys, chords=keyChords(c.root, c.scale, c.sevenths);
  let h=`<p class="kicker">chord family</p><h1 class="title">Key of ${nn(c.root)} <em>${SCALES[c.scale].label}</em></h1>`;
  h+=seg(KEY_SEG,'chords');
  h+=keyPicker(c, KEY_MODES);
  if(!chords.length){
    h+=`<div class="empty">Five and six note scales don't stack into a full chord family.
        Pick a seven note mode above.</div>`;
    stage.innerHTML=h; return;
  }
  h+=`<p class="sub">Tap a chord to see its shapes</p><div class="pills">`;
  for(const ch of chords)
    h+=`<button class="pill" data-root="${ch.rootPc}" data-type="${ch.type}">
          <b>${chordName(ch.rootPc,ch.type)}</b><i>${romanFor(ch,c.root,c.scale)}</i></button>`;
  h+='</div>';
  h+=`<div class="mapwrap">${fretboardSVG(c.root, SCALES[c.scale].ivs, false, c.maxFret)}</div>`;
  h+=`<p class="note">Say <code>sevenths</code> to stack another third on each chord,
      or <code>${nn(c.root)} mixolydian</code> to see the same key in another mode.</p>`;
  stage.innerHTML=h;
  bindPills();
}

// A bVII is a flat, so name it Bb even in a sharp key. The numeral already
// says which way it leans; the chord name should agree with it.
function progName(x){
  const p=pc(x.rootPc);
  if(x.outside && x.rn){
    if(x.rn[0]==='b') return FLAT[p]+CHORDS[x.type].sym;
    if(x.rn[0]==='#') return SHARP[p]+CHORDS[x.type].sym;
  }
  return chordName(p,x.type);
}

function renderProg(){
  const c=S.keys, chords=keyChords(c.root, c.scale, c.sevenths);
  let h=`<p class="kicker">numbers first, then your key</p><h1 class="title">Progressions in ${nn(c.root)} <em>${SCALES[c.scale].label}</em></h1>`;
  h+=seg(KEY_SEG,'prog');
  h+=keyPicker(c, KEY_MODES);
  if(!chords.length){
    h+=`<div class="empty">Pick a seven note mode above to see progressions.</div>`;
    stage.innerHTML=h; return;
  }
  h+=`<p class="sub">Tap a chord to see its shapes</p>`;

  let headed=false;
  for(const pr of PROGRESSIONS){
    const res=resolveProg(pr, c.root, c.scale, c.sevenths);
    if(!res.length) continue;
    const strays=res.filter(x=>x.outside);
    if(pr.chromatic && !headed){
      headed=true;
      h+=`<h3 class="setname">Chords from outside the key <span>the interesting ones</span></h3>`;
    }
    h+=`<div class="prog"><h3>${pr.name}</h3>
        <div class="rn">${res.map(x=>x.outside?`<b class="out">${x.rn}</b>`:x.rn).join('  –  ')}</div>
        <div class="chords">`;
    res.forEach(x=>{
      h+=`<button class="pill${x.outside?' out':''}" data-root="${x.rootPc}" data-type="${x.type}">${progName(x)}</button>`;
    });
    h+='</div>';
    const why=res.find(x=>x.outside && x.why);
    if(why) h+=`<p class="why"><b>${why.rn}</b> — ${why.why}</p>`;
    else if(pr.chromatic && !strays.length)
      h+=`<p class="why">All diatonic in ${SCALES[c.scale].label} — this one only sounds borrowed in a major key.</p>`;
    h+='</div>';
  }
  h+=`<p class="note">Gold means the chord sits outside the key. That is the point of it —
      it is the note your ear does not expect that makes the change land.</p>`;
  stage.innerHTML=h;
  bindPills();
}

const FIND_SEG=[['chords','Chords','find chords'],['notes','Notes','find notes']];
const QCYCLE=['major','minor','7','m7','maj7','sus4','sus2','dim','m7b5','aug'];
const fname=c=>(c.flat?FLAT:SHARP)[c.root]+(CHORDS[c.type]?CHORDS[c.type].sym:'');
const pname=n=>(n.flat?FLAT:SHARP)[n.pc];
// Major keys lean flat (Eb, Ab, Bb), minor keys lean sharp (C#m, F#m, G#m).
// Nobody writes Gb minor.
const MINORISH=['minor','dorian','phrygian','locrian','harmonic minor',
                'melodic minor','minor pentatonic','blues'];
const MINOR_SPELL={1:'C\u266F',3:'E\u266D',6:'F\u266F',8:'G\u266F',10:'B\u266D'};
function keyName(r, key){
  r=pc(r);
  if(key && MINORISH.includes(key)) return MINOR_SPELL[r]||SHARP[r];
  const k=KEYNAMES.find(x=>x[1]===r);
  return k?k[0]:SHARP[r];
}

function renderFind(){
  const f=S.find;
  const isCh=f.mode==='chords';
  const picked=isCh?f.chords:f.notes;

  let h=`<p class="kicker">work backwards from what you played</p>
         <h1 class="title">Find the <em>key</em></h1>`;
  h+=seg(FIND_SEG, f.mode);
  h+=`<p class="sub">${isCh?'Tap the chords you’re playing, in the order you play them'
                          :'Tap the notes of your riff, in order'}</p>`;
  h+=`<div class="picker"><div class="keyrow">`;
  for(const [label,p,flat] of CHORD_KEYS)
    h+=`<button class="keybtn" data-fadd="${p}" data-fflat="${flat}">${label}</button>`;
  h+=`</div></div>`;

  if(!picked.length){
    h+=`<div class="empty">Nothing picked yet. ${isCh
        ? 'Tap a few chords — four is usually plenty. Then tap any chip to change it from major to minor, a 7th and so on.'
        : 'Tap the notes you played. Order matters a little: starting and landing on a note is evidence it’s the tonic.'}</div>`;
    stage.innerHTML=h; return;
  }

  h+=`<div class="sel">`;
  picked.forEach((x,i)=>{
    const label=isCh?fname(x):pname(x);
    h+=`<span class="fchip"><button data-fcyc="${i}">${label}</button>`+
       `<button class="x" data-fdel="${i}" aria-label="Remove ${label}">×</button></span>`;
  });
  h+=`<button class="fclear" data-cmd="clear">Clear</button></div>`;
  if(isCh) h+=`<p class="hint">Tap a chord to cycle major → minor → 7th → m7 …</p>`;

  // ---- the answer ----
  if(isCh){
    const res=analyzeChords(f.chords);
    const tops=topDistinct(res,4);
    h+=`<h3 class="setname">Most likely <span>best fit first</span></h3>`;
    for(const r of tops){
      const rel=relativesOf(res,r,3);
      h+=`<div class="result"><button class="rhead" data-goroot="${r.root}" data-goscale="${r.key}">
            <b>${keyName(r.root,r.key)} ${SCALES[r.key].label}</b>
            <i>${r.inKey} of ${f.chords.length} chords belong to it</i></button>
          <div class="rns">`;
      r.roles.forEach((x,i)=>{
        const cls=x.fit==='in'?'':' out';
        h+=`<span class="rnpair${cls}"><b>${fname(f.chords[i])}</b><i>${x.rn}</i></span>`;
      });
      h+=`</div>`;
      const sec=r.roles.filter(x=>x.fit==='sec').length;
      const bor=r.roles.filter(x=>x.fit==='bor').length;
      const bad=r.roles.filter(x=>x.fit==='out'||x.fit==='alt').length;
      const notes=[];
      if(sec) notes.push(sec===1?'one secondary dominant':sec+' secondary dominants');
      if(bor) notes.push(bor===1?'one borrowed chord':bor+' borrowed chords');
      if(bad) notes.push(bad===1?'one chord that doesn’t belong':bad+' chords that don’t belong');
      if(notes.length) h+=`<p class="why">${notes.join(', ')}</p>`;
      if(rel.length) h+=`<p class="why">Same notes as ${rel.map(x=>keyName(x.root,x.key)+' '+SCALES[x.key].label).join(', ')}.</p>`;
      h+=`</div>`;
    }
    h+=`<p class="note">Tap a key to open its chord family. Gold means the chord sits
        outside that key — which is useful information, not a mistake.</p>`;
  } else {
    const res=analyzeNotes(f.notes.map(n=>n.pc));
    const keys=topDistinct(res.filter(r=>SCALES[r.key].ivs.length===7),3);
    const scl=topDistinct(res.filter(r=>SCALES[r.key].ivs.length<7 && !r.missing.length),3);
    h+=`<h3 class="setname">Keys <span>seven notes, so they have a chord family</span></h3>`;
    for(const r of keys){
      const rel=relativesOf(res,r,3);
      h+=`<div class="result"><button class="rhead" data-goroot="${r.root}" data-goscale="${r.key}">
            <b>${keyName(r.root,r.key)} ${SCALES[r.key].label}</b>
            <i>${r.missing.length?r.missing.length+' of your notes don’t fit'
                                 :'every note you played fits'}</i></button>`;
      if(rel.length) h+=`<p class="why">Identical notes to ${rel.map(x=>keyName(x.root,x.key)+' '+SCALES[x.key].label).join(', ')} — which one it is depends on where the riff resolves.</p>`;
      h+=`</div>`;
    }
    if(scl.length){
      h+=`<h3 class="setname">Tighter fits <span>fewer notes, no spare tones</span></h3>`;
      for(const r of scl)
        h+=`<div class="result"><button class="rhead" data-goroot="${r.root}" data-goscale="${r.key}">
              <b>${keyName(r.root,r.key)} ${SCALES[r.key].label}</b>
              <i>contains exactly what you played</i></button></div>`;
    }
    h+=`<p class="note">Notes alone can’t settle the tonic — the same seven notes are
        seven different modes. If you know the chords, that tab gets you a much
        sharper answer.</p>`;
  }
  stage.innerHTML=h;
}

/* ==================================================================
   SONGS
   ================================================================== */
/* Every note written into a tab, left to right. Row 0 is the high e, so it
   maps to the LAST entry in TUNING, which runs low to high. */
function songNotes(g){
  const out=[];
  for(const sec of g.sections){
    if(!sec.tab) continue;
    for(let c=0;c<sec.tab.cols;c++)
      for(let r=0;r<6;r++){
        const v=tabCell(sec.tab,r,c);
        if(/^\d+$/.test(v)) out.push(pc(TUNING[5-r]+parseInt(v,10)));
      }
  }
  return out;
}

/* Chords are far better evidence of a key than a melody is, so they lead.
   Riff notes then nudge between the candidates the chords left tied -- and
   if there are no chords at all, the riff answers on its own. */
function songKey(g){
  const chords=[];
  for(const sec of g.sections) for(const c of sec.chords) chords.push(c);
  const notes=songNotes(g);

  if(chords.length>=2){
    const res=analyzeChords(chords);
    if(notes.length){
      for(const r of res){
        const set=SCALES[r.key].ivs.map(i=>pc(r.root+i));
        const fit=notes.filter(x=>set.includes(x)).length;
        r.score += (fit/notes.length)*9;          // how much of the riff it explains
      }
      res.sort((a,b)=>b.score-a.score);
    }
    const r=topDistinct(res,1)[0];
    if(!r) return null;
    const set=SCALES[r.key].ivs.map(i=>pc(r.root+i));
    return {root:r.root, scale:r.key, inKey:r.inKey, total:chords.length,
            from: notes.length?'both':'chords',
            riffFit: notes.length?notes.filter(x=>set.includes(x)).length:0,
            riffTotal: notes.length};
  }

  if(notes.length>=4){
    const res=analyzeNotes(notes).filter(x=>SCALES[x.key].ivs.length===7);
    const r=topDistinct(res,1)[0];
    if(!r) return null;
    return {root:r.root, scale:r.key, inKey:0, total:0, from:'riff',
            riffFit:notes.length-r.missing.length, riffTotal:notes.length};
  }
  return null;
}

/* A 6-string grid. Tapping a cell opens a number pad rather than the
   system keyboard -- far less painful with a guitar in your lap. */
/* One system: the six string lines across a span of beats. */
function tabSystem(sec, from, to, editable){
  const t=sec.tab, sel=editable?(S.songs.tsel||''):'';
  const cols=to-from;
  let h=`<div class="tabwrap"><div class="tabed ${editable?'ed':'ro'}" style="--cols:${cols}">`;
  h+=`<span class="tnum"></span>`;
  for(let c=from;c<to;c++)
    h+=`<span class="tnum">${c%4===0?(c/4+1):''}</span>`;
  for(let r=0;r<6;r++){
    h+=`<span class="tstr">${TAB_STRINGS[r]}</span>`;
    for(let c=from;c<to;c++){
      const key=sec.id+':'+r+':'+c, v=tabCell(t,r,c);
      // no bar line on the first beat of a system -- the staff edge is one
      const cls='tpos'+(c>from && c%4===0?' bar':'')+(v?' has':'')+(sel===key?' on':'');
      const inner=v?`<b>${v}</b>`:'';
      h+= editable
        ? `<button class="${cls}" data-tcell="${key}" aria-label="string ${TAB_STRINGS[r]}, beat ${c+1}">${inner}</button>`
        : `<span class="${cls}">${inner}</span>`;
    }
  }
  return h+`</div></div>`;
}

/* Editing stays one continuous scrolling staff, because you need to see what
   comes next while you type. Reading wraps every two bars, the way printed
   tab does, so nothing runs off the side of the page. */
const BARS_PER_LINE=2, BEATS_PER_BAR=4;
function tabStaff(sec, editable){
  const t=sec.tab;
  if(editable) return tabSystem(sec,0,t.cols,true);
  const per=BARS_PER_LINE*BEATS_PER_BAR;
  let h='<div class="tabsystems">';
  for(let from=0; from<t.cols; from+=per)
    h+=tabSystem(sec, from, Math.min(from+per,t.cols), false);
  return h+'</div>';
}

/* Fullscreen editing. The staff and the number pad both have to be on
   screen at once, otherwise entering a note scrolls the pad out of reach. */
function tabFullscreen(sec){
  const sel=S.songs.tsel||'';
  let h=`<div class="tabfull">
    <div class="tfhead">
      <b>${esc(sec.kind)}</b><span>tab</span>
      <button data-tabclose="1">Done</button>
    </div>
    <div class="tfboard">${tabStaff(sec,true)}</div>
    <div class="tfpad">`;
  if(sel.split(':')[0]===sec.id){
    const [,sr,sc]=sel.split(':');
    h+=`<p class="tfwhere">${TAB_STRINGS[+sr]} string &nbsp;·&nbsp; bar ${Math.floor(sc/4)+1}, beat ${(+sc)%4+1}</p>`;
    h+=`<div class="numpad big">`;
    for(let n=0;n<=15;n++) h+=`<button data-tset="${n}">${n}</button>`;
    h+=`</div>`;
    h+=`<div class="padacts">
          <button class="del" data-tset="">⌫ Delete note</button>
          <button data-tset="x">× Mute string</button>
        </div>`;
  } else {
    h+=`<p class="hint">Tap a position on the staff to start.</p>`;
  }
  h+=`<div class="tabtools">
        <button data-tabcols="${sec.id}">+ 8 beats</button>
        <button data-tabdel="${sec.id}">Remove tab</button>
      </div>`;
  return h+`</div></div>`;
}

function tabEditor(sec){
  const sel=S.songs.tsel||'';
  // While the fullscreen editor is open this section's staff lives there.
  // Rendering it twice puts two identical sets of tap targets in the page.
  if(S.songs.tabFull===sec.id)
    return `<p class="hint">Editing this tab full screen.</p>
            <div class="tabtools"><button data-tabfull="${sec.id}">Reopen</button></div>`;
  let h=tabStaff(sec,true);
  h+=`<div class="tabtools">
        <button data-tabfull="${sec.id}">\u2922 Full screen</button>
        <button data-tabcols="${sec.id}">+ 8 beats</button>
        <button data-tabdel="${sec.id}">Remove tab</button>
      </div>`;
  if(sel.split(':')[0]===sec.id){
    h+=`<div class="numpad">`;
    for(let n=0;n<=15;n++) h+=`<button data-tset="${n}">${n}</button>`;
    h+=`<button data-tset="x">×</button><button data-tset="">clear</button>`;
    h+=`<button class="done" data-tset="done">done</button></div>`;
  } else {
    h+=`<p class="hint">Tap a position on any string to put a fret number there.
        Numbers along the top are bars; the heavier vertical lines are bar lines.</p>`;
  }
  return h;
}

function vibeHTML(v){
  if(!v) return '';
  return `<p class="vibe">${v.s}</p>
    <dl class="vibedl">
      <div><dt>The note that does it</dt><dd>${v.n}</dd></div>
      <div><dt>Sounds like</dt><dd>${v.u}</dd></div>
      <div><dt>Listen for</dt><dd>${v.t}</dd></div>
    </dl>`;
}

function scaleOptions(k){
  const minorish=MINORISH.includes(k.scale);
  const tonic=keyName(k.root,k.scale);
  // name the relative root from the parent key's own spelling, so the
  // relative minor of F# major is D# minor and never Eb minor
  const deg=SCALES[k.scale].ivs.length===7 ? scaleNotes(k.root,k.scale) : null;
  const relName = deg ? (minorish ? deg[2] : deg[5]) : null;
  const out=[{root:k.root, scale:k.scale, label:'The key', name:tonic}];
  if(minorish){
    out.push({root:k.root, scale:'minor pentatonic', label:'Minor pent', name:tonic});
    out.push({root:k.root, scale:'blues', label:'Blues', name:tonic});
    out.push({root:pc(k.root+3), scale:'major pentatonic', label:'Relative major pent', name:relName, vibe:REL_VIBE});
  } else {
    out.push({root:k.root, scale:'major pentatonic', label:'Major pent', name:tonic});
    out.push({root:k.root, scale:'major blues', label:'Major blues', name:tonic});
    out.push({root:pc(k.root+9), scale:'minor pentatonic', label:'Relative minor pent', name:relName, vibe:REL_VIBE});
    out.push({root:k.root, scale:'blues', label:'Blues (minor)', name:tonic});
  }
  return out;
}
// keyName gives D♯, scaleNotes gives D# -- make the dropdown consistent
const pretty=t=>String(t).replace(/#/g,'\u266F').replace(/b/g,'\u266D');
const optName=o=>pretty(o.name||keyName(o.root,o.scale));
function songScales(k){
  const open=S.songs.scaleOpen;
  const opts=scaleOptions(k);
  const i=Math.min(S.songs.scalePick==null?1:S.songs.scalePick, opts.length-1);
  let h=`<div class="scalebox">
    <button class="scalehead" data-scaletoggle="1" aria-expanded="${open}">
      <b>Scales over ${keyName(k.root,k.scale)} ${SCALES[k.scale].label}</b>
      <i>${open?'hide':'show'}</i>
    </button>`;
  if(open){
    const o=opts[i], sc=SCALES[o.scale];
    h+=`<select class="scalesel" data-scalesel="1" aria-label="Which scale">`;
    opts.forEach((x,j)=>{
      h+=`<option value="${j}"${j===i?' selected':''}>${x.label} · ${optName(x)} ${SCALES[x.scale].label}</option>`;
    });
    h+=`</select>`;
    h+=`<p class="sub"><b>${scaleNotes(o.root,o.scale,o.name).join('  ')}</b></p>`;
    h+=`<div class="mapwrap">${fretboardSVG(o.root, sc.ivs, false, 15, scaleSpellMap(o.root,o.scale,o.name))}</div>`;
    h+=`<p class="why">Gold dots are home — the note the scale is named after.</p>`;

/* Typing must not re-render -- that would throw away the cursor on every
   keystroke -- so these write straight to state and save. */
function bindSongInputs(){
  const name=document.getElementById('songname');
  if(name) name.addEventListener('input',()=>{
    const g=openSong(); if(g){ g.name=name.value; touchSong(g); saveSongs(); }
  });
  qa('[data-stext]').forEach(t=>t.addEventListener('input',()=>{
    const g=openSong(); if(!g) return;
    const sec=g.sections.find(x=>x.id===t.dataset.stext);
    if(sec){ sec.text=t.value; touchSong(g); saveSongs(); }
  }));
  const file=document.getElementById('songfile');
  if(file) file.addEventListener('change',()=>{
    const f=file.files && file.files[0]; if(!f) return;
    const rd=new FileReader();
    rd.onload=()=>{
      try{
        const v=JSON.parse(rd.result);
        if(!Array.isArray(v)) throw 0;
        commit(()=>{
          for(const g of v){
            if(!g||!Array.isArray(g.sections)) continue;
            g.id=uid(); g.updated=Date.now();
            S.songs.list.push(g);
          }
          saveSongs();
        });
      }catch(e){ alert('That file was not a Chord Caddy export.'); }
    };
    rd.readAsText(f);
  });
}

function exportSongs(){
  try{
    const blob=new Blob([JSON.stringify(S.songs.list,null,2)],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='chord-caddy-songs.json';
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1000);
  }catch(e){}
}

function bindPills(){
  stage.querySelectorAll('[data-root]').forEach(el=>{
    el.addEventListener('click',()=>commit(()=>{
      S.chords.root=+el.dataset.root; S.chords.chord=el.dataset.type;
      S.chords.posIdx=0; S.chords.sticky=true; S.chords.mode='full';
      S.section='chords';
    }));
  });
}

/* ==================================================================
   6. TABS  -- one tap to any section, no menu in between
   ================================================================== */
function buildTabs(){
  tabs.innerHTML=SECTIONS.map(([id,label])=>
    `<button data-sec="${id}" aria-current="${id===S.section}">${label}</button>`).join('');
  tabs.querySelectorAll('[data-sec]').forEach(b=>b.addEventListener('click',()=>{
    if(b.dataset.sec===S.section) return;
    commit(()=>{ S.section=b.dataset.sec; });
  }));
}

/* ---------- quick buttons, per view ---------- */
const CHIPSETS={
  chord:[['Major','major'],['Minor','minor'],['7th','7'],['m7','m7'],['maj7','maj7'],
         ['6th','6'],['sus2','sus2'],['sus4','sus4'],['add9','add9'],['9th','9'],
         ['dim','dim'],['dim7','dim7'],['aug','aug'],['m7b5','m7b5'],['5','power chord'],
         ['Up to 19','up to fret 19'],['Whole neck','whole neck']],
  triad:[['All sets','all strings'],['Top strings','top strings'],['Middle','middle strings'],
         ['Major','major triads'],['Minor','minor triads'],['dim','dim triads'],
         ['aug','aug triads'],['sus2','sus2 triads'],['sus4','sus4 triads']],
  scale:[['Major','major scale'],['Minor','minor scale'],['Mixolydian','mixolydian'],
         ['Dorian','dorian'],['Pentatonic','minor pentatonic'],['Blues','blues'],
         ['Whole neck','whole neck']],
  key:[['Sevenths','sevenths'],['Triads','triads in key'],['Major','major'],['Minor','minor'],
       ['Mixolydian','mixolydian'],['Dorian','dorian']],
  prog:[['Major','major'],['Minor','minor'],['Mixolydian','mixolydian'],['Dorian','dorian'],
        ['Sevenths','sevenths']],
  find:[['Chords','find chords'],['Notes','find notes'],['Clear','clear']],
  songs:[['New song','new song']]
};
/* The Songs chips depend on where you are: nothing about starting or
   listing songs is useful while you are editing one. */
function songChips(){
  if(!S.songs.openId) return [['+ New song','new song']];
  if(S.songs.editing) return [['Done','done editing']];
  return [['Edit','edit song'],['All songs','all songs'],['+ New song','new song']];
}
function renderChips(){
  chipbar.innerHTML='';
  chipbar.scrollLeft=0;
  const set = viewName()==='songs' ? songChips() : CHIPSETS[viewName()];
  for(const [label,cmd] of set){
    const b=document.createElement('button');
    b.className='chip'; b.textContent=label;
    b.addEventListener('click',()=>run(cmd));
    chipbar.appendChild(b);
  }
}

/* ==================================================================
   7. INPUT
   ================================================================== */
function command(text){
  const t=text.toLowerCase();
  if(/^\s*(go to |show )?(back)\s*$/.test(t)) return;
  if(/^\s*(go to |show )?(chords?|chord section)\s*$/.test(t)){ S.section='chords'; return; }
  if(/^\s*(go to |show )?(scales?|scale section)\s*$/.test(t)){ S.section='scales'; return; }
  if(/^\s*(go to |show )?(keys?|key section)\s*$/.test(t)){ S.section='keys'; return; }
  if(/\bnote names?\b/.test(t)){ S.section='scales'; S.scales.degrees=false; return; }
  if(/\b(show )?degrees?\b/.test(t)){ S.section='scales'; S.scales.degrees=true; return; }
  if(/^\s*(go to |show )?(find|identif\w*|what key)\s*$/.test(t)){ S.section='find'; return; }
  if(/\bfind chords?\b/.test(t)){ S.section='find'; S.find.mode='chords'; return; }
  if(/\bfind notes?\b/.test(t)){ S.section='find'; S.find.mode='notes'; return; }
  if(/^\s*clear\s*$/.test(t)){ S.find.chords=[]; S.find.notes=[]; S.section='find'; return; }
  if(/^\s*(go to |show )?(songs?|library)\s*$/.test(t)){ S.section='songs'; return; }
  if(/\bnew song\b/.test(t)){ const g=newSong(); S.songs.list.unshift(g);
    S.songs.openId=g.id; S.songs.editing=true; S.section='songs'; saveSongs(); return; }
  if(/\ball songs?\b/.test(t)){ S.songs.openId=null; S.section='songs'; return; }
  if(/\bedit song\b/.test(t)){ S.songs.editing=true; S.section='songs'; return; }
  if(/\bdone editing\b/.test(t)){ S.songs.editing=false; S.songs.addTo=null; S.section='songs'; return; }
  if(/\bsevenths?\b/.test(t)){ S.keys.sevenths=true; S.section='keys'; return; }
  if(/\btriads in key\b/.test(t)){ S.keys.sevenths=false; S.section='keys'; S.keys.tab='chords'; return; }
  apply(parse(text, {view:viewName(), sticky:S.chords.sticky}));
}
function run(text){
  if(!text||!text.trim()) return;
  if(/^\s*(go )?back\s*$/i.test(text)){ goBack(); return; }
  commit(()=>command(text));
}
backBtn.addEventListener('click',goBack);
const q=document.getElementById('q');
document.getElementById('go').addEventListener('click',()=>{ run(q.value); q.value=''; q.blur(); });
q.addEventListener('keydown',e=>{ if(e.key==='Enter'){ run(q.value); q.value=''; q.blur(); } });

/* built-in browser speech, no account or key needed */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(SR){
  const mic=document.getElementById('mic');
  mic.hidden=false;
  const rec=new SR();
  rec.lang='en-US'; rec.interimResults=false; rec.maxAlternatives=1;
  let on=false;
  mic.addEventListener('click',()=>{ on?rec.stop():rec.start(); });
  rec.onstart=()=>{ on=true; mic.classList.add('on'); };
  rec.onend=()=>{ on=false; mic.classList.remove('on'); };
  rec.onerror=()=>{ on=false; mic.classList.remove('on'); };
  rec.onresult=e=>{ run(e.results[0][0].transcript); };
}

loadSongs();
render();
// pull from GitHub in the background; the app is already usable
if(typeof fetch==='function'){
  setTimeout(()=>syncNow(true),300);
  readDeployTime();
}
</script>
